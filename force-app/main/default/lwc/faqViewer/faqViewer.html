<template>
    <div class="faq-page">

        <!-- Header -->
        <div class="faq-header">
            <h1 class="faq-header__title">FAQ</h1>

            <!-- Search Bar -->
            <div class="faq-search">
                <lightning-icon
                    class="faq-search__icon"
                    icon-name="utility:search"
                    size="x-small"
                    alternative-text="Pesquisar">
                </lightning-icon>
                <input
                    type="text"
                    class="faq-search__input"
                    placeholder="Pesquisar..."
                    value={searchTerm}
                    oninput={handleSearch}
                    aria-label="Pesquisar perguntas frequentes"
                />
                <template if:true={searchTerm}>
                    <button class="faq-search__clear" onclick={clearSearch} aria-label="Limpar pesquisa">
                        <lightning-icon icon-name="utility:close" size="x-small" alternative-text="Limpar"></lightning-icon>
                    </button>
                </template>
            </div>
        </div>

        <!-- Content Area -->
        <div class="faq-content">

            <!-- Loading State -->
            <template if:true={isLoading}>
                <div class="faq-state faq-state--loading">
                    <lightning-spinner alternative-text="Carregando..." size="medium"></lightning-spinner>
                    <p class="faq-state__text">Carregando perguntas...</p>
                </div>
            </template>

            <!-- Error State -->
            <template if:true={hasError}>
                <div class="faq-state faq-state--error">
                    <lightning-icon icon-name="utility:error" size="large" alternative-text="Erro"></lightning-icon>
                    <p class="faq-state__title">Algo deu errado</p>
                    <p class="faq-state__text">Não foi possível carregar as perguntas. Tente recarregar a página.</p>
                </div>
            </template>

            <!-- Empty State -->
            <template if:true={isEmpty}>
                <div class="faq-state faq-state--empty">
                    <lightning-icon icon-name="utility:search" size="large" alternative-text="Sem resultados"></lightning-icon>
                    <p class="faq-state__title">Nenhuma pergunta encontrada</p>
                    <p class="faq-state__text">Tente usar outros termos na pesquisa.</p>
                </div>
            </template>

            <!-- FAQ List -->
            <template if:true={hasResults}>
                <ul class="faq-list" role="list">
                    <template for:each={filteredFaqs} for:item="faq">
                        <li key={faq.Id} class="faq-item" role="listitem">
                            <h2 class="faq-item__question">{faq.Question__c}</h2>
                            <div class="faq-item__answer" id={faq.answerId}>
                                <lightning-formatted-rich-text
                                    value={faq.Answer__c}>
                                </lightning-formatted-rich-text>
                            </div>
                        </li>
                    </template>
                </ul>

                <!-- Pagination -->
                <template if:true={hasPagination}>
                    <div class="faq-pagination">
                        <template for:each={pages} for:item="page">
                            <button
                                key={page.number}
                                class={page.buttonClass}
                                data-page={page.number}
                                onclick={goToPage}>
                                {page.number}
                            </button>
                        </template>
                    </div>
                </template>

            </template>

        </div>
    </div>
</template>
