<template>
    <lightning-card title="Gestão de Pricing" icon-name="standard:currency">
        <div class="slds-p-around_medium">
            
            <template if:false={precosRecalculados}>
                <div class="slds-notify slds-notify_alert slds-alert_warning slds-m-bottom_medium" role="alert">
                    <lightning-icon icon-name="utility:warning" variant="inverse" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                    <h2>Os parâmetros de preço mudaram. Por favor, recalcule.</h2>
                </div>
            </template>

            <div class="container-botao">
                <lightning-button 
                    label="Recalcular Pricing" 
                    variant="brand" 
                    onclick={handleRecalcular}
                    class="botao-cheio">
                </lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
